{% extends "base.html" %}

{% block title %}Edit Expense · Smart Expense Tracker{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Edit Expense</h1>
    <p>Update expense details</p>
</div>

<div class="card form-card">
    <form method="POST" action="{{ url_for('edit_expense', expense_id=expense['id']) }}" class="expense-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-row">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" value="{{ expense['amount'] }}" step="0.01" min="0.01" required class="form-input">
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ expense['date'] }}" required class="form-input">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category_id">Category</label>
                <select id="category_id" name="category_id" required class="form-input">
                    {% for cat in categories %}
                        <option value="{{ cat['id'] }}" {% if cat['id'] == expense['category_id'] %}selected{% endif %}>
                            {{ cat['icon'] }} {{ cat['name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" value="{{ expense['description'] }}" required class="form-input">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('expenses') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
