{% extends "base.html" %}

{% block title %}Login · Smart Expense Tracker{% endblock %}

{% block content %}

<div class="auth-card card">
    <div class="page-header">
        <h1>Login</h1>
        <p>Sign in to manage your expenses</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="expense-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required class="form-input" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required class="form-input" autocomplete="current-password">
        </div>

        <div class="form-group checkbox-row">
            <label>
                <input type="checkbox" name="remember" value="1"> Remember me
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="auth-footer">
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a> ·
        <a href="{{ url_for('register') }}">Register</a>
    </p>
</div>

{% endblock %}
