{% extends "base.html" %}

{% block title %}Register · Smart Expense Tracker{% endblock %}

{% block content %}

<div class="auth-card card">
    <div class="page-header">
        <h1>Create Account</h1>
        <p>Your expenses are private to your account</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="expense-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" class="form-input" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required class="form-input" autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" class="form-input" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6" class="form-input" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>

{% endblock %}
