{% extends "base.html" %}

{% block title %}Forgot Password · Smart Expense Tracker{% endblock %}

{% block content %}

<div class="auth-card card">
    <div class="page-header">
        <h1>Forgot Password</h1>
        <p>Enter your email to receive a reset link</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}" class="expense-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required class="form-input" autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>

    <p class="auth-footer"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>

{% endblock %}
