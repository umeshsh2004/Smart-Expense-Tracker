{% extends "base.html" %}

{% block title %}Reset Password · Smart Expense Tracker{% endblock %}

{% block content %}

<div class="auth-card card">
    <div class="page-header">
        <h1>Reset Password</h1>
        <p>Choose a new password for your account</p>
    </div>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="expense-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required minlength="6" class="form-input">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6" class="form-input">
        </div>

        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>

    <p class="auth-footer"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>

{% endblock %}
